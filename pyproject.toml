[project]
name = "dgcnn"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "h5py>=3.16.0",
    "scikit-learn>=1.8.0",
    "tqdm>=4.69.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
]
cpu = [
    "torch>=2.13.0",
]
cu118 = [
    "torch>=2.7.1",
]
cu126 = [
    "torch>=2.12.1",
]
cu132 = [
    "torch>=2.12.1",
]
[tool.uv]
conflicts = [
    [{ group = "cpu" }, { group = "cu118" }, { group = "cu126" }, { group = "cu132" }]
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu118", group = "cu118" },
    { index = "pytorch-cu126", group = "cu126" },
    { index = "pytorch-cu132", group = "cu132" },
]

[tool.mypy]
strict = true
exclude = [".venv"]

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "h5py", "tqdm"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
